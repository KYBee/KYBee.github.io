  - name: projects
    label: 경력 프로젝트
    type: collection
    path: src/content/projects
    format: yaml
    subfolders: false
    filename:
      template: "{primary}.{lang}.yaml"
      field: create
    operations:
      create: true
      rename: false
      delete: true
    view:
      fields: [company, title, lang, order]
      primary: company
      sort: [order]
      default:
        sort: order
        order: asc
    fields:
      - name: company
        label: 회사
        type: string
        required: true
      - name: role
        label: 역할
        type: string
        required: true
      - name: period
        label: 기간
        type: string
        required: true
      - name: location
        label: 위치
        type: string
      - name: title
        label: 프로젝트명
        type: string
      - name: summary
        label: 요약
        type: text
      - name: bullets
        label: 주요 내용
        type: text
        list:
          max: 4
          collapsible: false
      - name: metric
        label: 성과 지표
        type: string
      - name: tags
        label: 태그
        type: string
        list: true
        default: []
      - name: lang
        label: 언어
        type: select
        required: true
        options:
          values: [ko, en]
      - name: order
        label: 정렬 순서
        type: number
        required: true

