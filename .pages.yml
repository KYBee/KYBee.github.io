settings:
  content:
    merge: false
  commit:
    identity: app
    templates:
      create: "content(create): {path}"
      update: "content(update): {path}"
      delete: "content(delete): {path}"
      rename: "content(rename): {oldPath} -> {newPath}"

actions:
  - name: validate-content
    label: 콘텐츠 검사
    workflow: content-check.yml
    ref: current
  - name: request-publish
    label: 게시 요청
    workflow: content-publish.yml
    ref: main
    confirm:
      title: 게시를 요청할까요?
      message: 현재 브랜치의 콘텐츠 게시 워크플로를 실행합니다.
      button: 게시 요청

content:
  - name: about-ko
    label: 소개 (한국어)
    type: file
    path: src/content/about/ko.yaml
    format: yaml
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: name
        label: 이름
        type: string
        required: true
      - name: title
        label: 직함
        type: string
        required: true
      - name: tagline
        label: 한 줄 소개
        type: text
        required: true
      - name: location
        label: 위치
        type: string
        required: true
      - name: links
        label: 링크
        type: object
        required: true
        fields:
          - name: github
            label: GitHub
            type: string
            required: true
          - name: blog
            label: 블로그
            type: string
            required: true
          - name: linkedin
            label: LinkedIn
            type: string
            required: true
          - name: email
            label: 이메일
            type: string
            required: true
      - name: bullets
        label: 핵심 소개
        type: text
        required: true
        list: true
      - name: activities
        label: 활동
        type: string
      - name: status
        label: 상태
        type: string
        required: true
      - name: activityStatus
        label: 활동 상태
        type: string
        required: true
      - name: affiliation
        label: 소속
        type: string
        required: true
      - name: work
        label: 하는 일
        type: text
        required: true
      - name: interests
        label: 관심사
        type: text
        required: true
      - name: strengths
        label: 강점
        type: text
        required: true
      - name: whereabouts
        label: 근황
        type: text
        required: true
      - name: lang
        label: 언어
        type: select
        required: true
        readonly: true
        options:
          values: [ko, en]

