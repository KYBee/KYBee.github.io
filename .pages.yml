        type: object
        required: true
        fields:
          - name: github
            label: GitHub
            type: string
            required: true
          - name: blog
            label: Blog
            type: string
            required: true
          - name: linkedin
            label: LinkedIn
            type: string
            required: true
          - name: email
            label: Email
            type: string
            required: true
      - name: bullets
        label: Highlights
        type: text
        required: true
        list: true
      - name: activities
        label: Activities
        type: string
      - name: status
        label: Status
        type: string
        required: true
      - name: activityStatus
        label: Activity status
        type: string
        required: true
      - name: affiliation
        label: Affiliation
        type: string
        required: true
      - name: work
