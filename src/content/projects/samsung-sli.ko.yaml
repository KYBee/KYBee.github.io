bullets:
  - "로그 추출 에이전트가 알림의 서비스, 리전, API, 시간 조건에 맞는 로그를 모읍니다. 같은 트랜잭션에서 나온 로그를 묶어 분석할 대상을 선별합니다."
  - "원인 분석 에이전트가 RAG로 과거 유사 사례를 찾습니다. 근거 로그와 관련 서버 코드를 함께 검토해 원인 후보를 좁힙니다."
  - "리포팅 에이전트가 원인 후보와 근거를 리포트로 정리해 기존 알림 스레드에 올립니다. 담당자는 알림을 받은 곳에서 분석을 요청하고 근거를 검토할 수 있습니다."
  - "초기 분석 결과를 직접 검토해 잘못된 판단을 에이전트 지침에 반영했습니다. 검토한 오류 패턴을 다음 분석의 참고 자료로 축적했습니다. 같은 분석 업무를 직접 측정해 약 10분으로 줄인 것을 확인했습니다."
