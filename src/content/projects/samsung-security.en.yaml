title: "Automating Vulnerable Package Analysis and Update PRs"
summary: "I built Security Bot to keep up with Dependabot security issues across legacy repositories. It automates issue collection, version analysis, and update PR preparation."
bullets:
  - "GitHub Actions periodically checks repositories and groups security issues by package."
  - "The LLM analyzes CVE details, current versions, and package configurations to suggest a target version."
  - "When the target version is clear, a script updates package configuration and creates a PR with a review request. Cases requiring a decision include candidate versions and supporting reasons."
  - "Maintainers review changes and test results before merging. I also built a web dashboard showing issues and PR status across repositories. The bot and dashboard remain in regular use."
