careerOverview:
  summary: I develop and operate the backend of a cloud backup and restore service used by tens of millions of people. My work covers service features, operational log analysis, quality metrics and tools for everyday workflows.
  responsibilities:
    - I build APIs and business logic with Java and Spring Boot, and operate an AWS-based microservice environment connecting databases, storage and messaging.
    - I process large volumes of operational logs to calculate user-perceived quality metrics, find failure causes and improve backup features and operations.
    - I build VOC lookup tools, shared log query tools and AI agents to reduce repetitive analysis and response work. I check behavior after changes with tests and code reviews.
