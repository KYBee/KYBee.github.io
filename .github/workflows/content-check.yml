name: Content Check

on:
  push:
    branches:
      - "content/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: false
        default: "{}"
        type: string

permissions:
  contents: read

concurrency:
  group: content-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce content-only scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          BASE_BRANCH: main
        shell: bash
        run: |
          set -euo pipefail

          source_branch=""
          case "$EVENT_NAME" in
            push)
              if [[ "$REF_TYPE" != "branch" ]]; then
                echo "Content checks require a branch ref." >&2
                exit 1
              fi
              source_branch="$REF_NAME"
              ;;
            pull_request)
              if [[ "$HEAD_REF" != content/* ]]; then
                exit 0
              fi
              if [[ "$BASE_REF" != "$BASE_BRANCH" ]]; then
                echo "Content pull requests must target $BASE_BRANCH." >&2
                exit 1
              fi
              source_branch="$HEAD_REF"
              ;;
            workflow_dispatch)
              if [[ "$REF_NAME" != content/* ]]; then
                exit 0
              fi
              if [[ "$REF_TYPE" != "branch" ]]; then
                echo "Content checks require a branch ref." >&2
                exit 1
              fi
              source_branch="$REF_NAME"
              ;;
            *)
              exit 0
              ;;
          esac

          if [[ ! "$source_branch" =~ ^content/[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Branch must match content/<lowercase-hyphen-name>." >&2
            exit 1
          fi

          git fetch --no-tags origin \
            "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"

          diff_file="$(mktemp)"
          trap 'rm -f "$diff_file"' EXIT
          git diff --no-renames --name-only -z "origin/$BASE_BRANCH...HEAD" > "$diff_file"

          content_changes=0
          while IFS= read -r -d '' path; do
            case "$path" in
              src/content/*)
                content_changes=$((content_changes + 1))
                ;;
              *)
                printf 'Refusing to verify a non-content path: %q\n' "$path" >&2
                exit 1
                ;;
            esac
          done < "$diff_file"

          if (( content_changes == 0 )); then
            echo "At least one src/content/** change is required." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run verify
