name: Deploy Reactions Worker

on:
  workflow_run:
    workflows:
      - Deploy to GitHub Pages
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main')
    environment: production-reactions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: production-release
      cancel-in-progress: false
      queue: max
    env:
      PUBLIC_REACTIONS_API_URL: ${{ vars.PUBLIC_REACTIONS_API_URL }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Verify release SHA
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test Worker
        run: npm run test:worker
      - name: Typecheck Worker
        run: npm run reactions:typecheck
      - name: Validate production API URL
        run: node scripts/validate-reactions-env.mjs --required
      - name: Verify current Pages release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PAGES_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          verified=false
          for attempt in $(seq 1 6); do
            latest="$(
              gh run list \
                --workflow deploy.yml \
                --branch main \
                --status success \
                --limit 1 \
                --json databaseId,headSha
            )"
            latest_id="$(jq -r '.[0].databaseId // empty' <<<"$latest")"
            latest_sha="$(jq -r '.[0].headSha // empty' <<<"$latest")"

            if [[ -n "$latest_id" ]]; then
              if [[ ! "$latest_id" =~ ^[0-9]+$ ]]; then
                echo "Current Pages release could not be verified." >&2
                exit 1
              fi
              if [[ "$latest_sha" == "$RELEASE_SHA" ]]; then
                verified=true
                break
              fi
              if [[
                -z "$SOURCE_PAGES_RUN_ID"
                || ! "$SOURCE_PAGES_RUN_ID" =~ ^[0-9]+$
                || "$latest_id" -ge "$SOURCE_PAGES_RUN_ID"
              ]]; then
                echo "Refusing to deploy a stale reactions release." >&2
                exit 1
              fi
            fi

            if [[ "$attempt" -lt 6 ]]; then
              sleep 5
            fi
          done

          if [[ "$verified" != true ]]; then
            echo "Current Pages release could not be verified." >&2
            exit 1
          fi
      - name: List pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --no-install wrangler d1 migrations list kybee-reactions
          --remote --config services/reactions/wrangler.jsonc
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --no-install wrangler d1 migrations apply kybee-reactions
          --remote --config services/reactions/wrangler.jsonc
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --no-install wrangler deploy
          --config services/reactions/wrangler.jsonc
      - name: Smoke production API
        run: node scripts/smoke-reactions-api.mjs
